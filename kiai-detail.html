<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kiai - DAIDANU PC LDNU Kebumen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nu: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#0f4a24',
                        },
                        emas: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-10 h-10 rounded-xl bg-nu-700 flex items-center justify-center text-white">
                    <i data-lucide="book-open" class="w-5 h-5 text-emas-400"></i>
                </a>
                <div>
                    <a href="index.html" class="text-xl font-bold tracking-tight text-nu-900 block">DAIDANU</a>
                    <p class="text-xs text-slate-500 font-medium">Profil Lengkap Da'i Muda PC LDNU Kebumen</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
                <a href="index.html" class="hover:text-nu-700 transition">Beranda</a>
                <a href="kiai-directory.html" class="text-nu-700 font-bold">Direktori Da'i</a>
                <a href="jamaah-konsultasi.html" class="hover:text-nu-700 transition">Tanya Fikih</a>
                <a href="jamaah-ngaturi.html" class="hover:text-nu-700 transition">Ngaturi Kiai</a>
            </nav>

            <a href="kiai-directory.html" class="text-xs font-semibold text-slate-600 hover:text-nu-700 flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Daftar
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="kiaiDetailCard" class="space-y-8">
            <!-- Rendered by JS -->
        </div>
    </main>

    <script src="assets/js/data-mock.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const kiaiId = parseInt(urlParams.get('id')) || 1;
            const allKiai = DataStore.getKiai();
            const kiai = allKiai.find(k => k.id_kiai === kiaiId) || allKiai[0];

            // Riwayat fatwa kiai ini
            const allKonsul = DataStore.getKonsultasi();
            const fatwaList = allKonsul.filter(c => c.jawaban && c.jawaban.id_kiai === kiai.id_kiai);

            const container = document.getElementById('kiaiDetailCard');
            container.innerHTML = `
                <!-- Header Profile Hero -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/90 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-96 h-96 bg-emerald-50/50 rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>

                    <div class="relative z-10 flex flex-col md:flex-row gap-8 items-start">
                        <div class="w-full md:w-56 h-64 rounded-2xl overflow-hidden shadow-md flex-shrink-0 bg-slate-100 border border-slate-200">
                            <img src="${kiai.foto}" alt="${kiai.nama_kiai}" class="w-full h-full object-cover">
                        </div>

                        <div class="flex-1 space-y-4">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-nu-100 text-nu-800 border border-nu-200">
                                    ${kiai.bidang_keahlian}
                                </span>
                                <span class="px-3 py-1 rounded-full text-xs font-bold ${kiai.status_aktif === 'aktif' ? 'bg-emerald-500 text-white' : 'bg-slate-400 text-white'}">
                                    ${kiai.status_aktif === 'aktif' ? '● Bersedia Menerima Jadwal' : '○ Jadwal Penuh'}
                                </span>
                            </div>

                            <div>
                                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${kiai.nama_kiai}</h1>
                                <p class="text-sm font-semibold text-nu-700 mt-1">${kiai.gelar}</p>
                            </div>

                            <p class="text-sm text-slate-600 leading-relaxed max-w-3xl">
                                ${kiai.bio}
                            </p>

                            <div class="grid sm:grid-cols-2 gap-4 pt-2">
                                <div class="flex items-start gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-100">
                                    <i data-lucide="home" class="w-5 h-5 text-nu-700 flex-shrink-0 mt-0.5"></i>
                                    <div>
                                        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Alamat Ndalem (Tujuan Sowan)</p>
                                        <p class="text-xs font-semibold text-slate-800">${kiai.alamat_ndalem}</p>
                                    </div>
                                </div>

                                <div class="flex items-start gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-100">
                                    <i data-lucide="clock" class="w-5 h-5 text-emas-600 flex-shrink-0 mt-0.5"></i>
                                    <div>
                                        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Waktu Ketersediaan Sowan & Kajian</p>
                                        <p class="text-xs font-semibold text-slate-800">${kiai.jadwal_tersedia}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex flex-wrap gap-3 pt-4 border-t border-slate-100">
                                <a href="jamaah-ngaturi.html?kiai_id=${kiai.id_kiai}" class="bg-nu-700 hover:bg-nu-800 text-white font-bold px-6 py-3 rounded-xl shadow-md shadow-emerald-700/20 text-xs sm:text-sm flex items-center gap-2 transition">
                                    <i data-lucide="calendar-plus" class="w-4 h-4"></i>
                                    <span>Ajukan Ngaturi (Undang Acara)</span>
                                </a>
                                <a href="jamaah-konsultasi.html?kiai_id=${kiai.id_kiai}" class="bg-emerald-50 hover:bg-emerald-100 text-nu-800 font-bold px-6 py-3 rounded-xl border border-emerald-200 text-xs sm:text-sm flex items-center gap-2 transition">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                                    <span>Tanya Fatwa / Konsultasi Fikih</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabs: Sanad & Fatwa Portfolio -->
                <div class="grid md:grid-cols-3 gap-6">
                    <div class="md:col-span-1 bg-white p-6 rounded-2xl border border-slate-200/90 shadow-sm space-y-4">
                        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-900 flex items-center gap-2">
                            <i data-lucide="award" class="w-4 h-4 text-emas-600"></i>
                            Sanad & Otoritas Ilmiah
                        </h2>
                        <ul class="space-y-3 text-xs text-slate-600">
                            <li class="flex items-start gap-2">
                                <i data-lucide="check" class="w-4 h-4 text-emerald-600 mt-0.5 flex-shrink-0"></i>
                                <span>Terdaftar resmi dalam Dewan Da'i Muda PC LDNU Kebumen.</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <i data-lucide="check" class="w-4 h-4 text-emerald-600 mt-0.5 flex-shrink-0"></i>
                                <span>Kajian merujuk pada kitab kuning muktabar Ahlussunnah wal Jama'ah.</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <i data-lucide="check" class="w-4 h-4 text-emerald-600 mt-0.5 flex-shrink-0"></i>
                                <span>Mendukung penuh tradisi kultural Nahdliyin (Tahlil, Maulid, Manaqib).</span>
                            </li>
                        </ul>
                    </div>

                    <div class="md:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/90 shadow-sm space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-900 flex items-center gap-2">
                                <i data-lucide="book-open-check" class="w-4 h-4 text-nu-700"></i>
                                Bimbingan & Fatwa yang Pernah Diberikan
                            </h2>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full font-semibold">
                                ${fatwaList.length} Fatwa
                            </span>
                        </div>

                        <div class="space-y-3">
                            ${fatwaList.length === 0 ? `
                                <p class="text-xs text-slate-400 italic py-4 text-center">Belum ada fatwa terbuka yang dipublikasikan oleh kiai ini.</p>
                            ` : fatwaList.map(f => `
                                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                                    <div class="flex items-center justify-between">
                                        <span class="text-[10px] font-bold text-nu-700 bg-nu-100 px-2 py-0.5 rounded">${f.nama_topik}</span>
                                        <span class="text-[11px] text-slate-400">${f.jawaban.tanggal_jawab}</span>
                                    </div>
                                    <h3 class="text-xs font-bold text-slate-900">${f.judul}</h3>
                                    <p class="text-xs text-slate-600 line-clamp-2 italic font-arabic">"${f.jawaban.teks_jawaban}"</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
